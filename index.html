<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kinderbewegungs-Tracker</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background-color: white;
      padding: 25px;
      border-radius: 12px;
    }

    input {
      width: 80%;
      padding: 12px;
      margin: 10px 0;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      margin: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .anzeige {
      margin-top: 25px;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🏃 Kinderbewegungs-Tracker</h1>

    <p>Bewegungszeit während der Schulzeit eintragen.</p>

    <input
      type="number"
      id="minuten"
      placeholder="Bewegungsminuten eingeben"
      min="1"
    >

    <br>

    <button onclick="bewegungHinzufuegen()">
      Bewegung hinzufügen
    </button>

    <div class="anzeige">
      Heute: <span id="gesamt">0</span> Minuten Bewegung
    </div>

    <button onclick="tagZuruecksetzen()">
      Tag zurücksetzen
    </button>

  </div>

  <script>
    let gesamtMinuten = 0;

    function bewegungHinzufuegen() {
      const eingabe = document.getElementById("minuten");
      const minuten = Number(eingabe.value);

      if (minuten > 0) {
        gesamtMinuten = gesamtMinuten + minuten;
        document.getElementById("gesamt").textContent = gesamtMinuten;
        eingabe.value = "";
      }
    }

    function tagZuruecksetzen() {
      gesamtMinuten = 0;
      document.getElementById("gesamt").textContent = 0;
    }
  </script>

</body>
</html>
