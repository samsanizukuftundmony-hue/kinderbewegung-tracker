<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kinderbewegungs-Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #e8f5e9, #e3f2fd);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 24px;
      padding: 30px 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    .icon {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 5px 0;
      font-size: 27px;
      color: #263238;
    }

    .beschreibung {
      color: #607d8b;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .status {
      background: #e8f5e9;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .status-klein {
      color: #607d8b;
      font-size: 14px;
    }

    .minuten {
      font-size: 42px;
      font-weight: bold;
      color: #2e7d32;
      margin: 5px 0;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 17px;
      text-align: center;
      outline: none;
      margin-bottom: 12px;
    }

    input:focus {
      border-color: #4caf50;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .hinzufuegen {
      background: #4caf50;
      color: white;
      font-weight: bold;
    }

    .hinzufuegen:hover {
      background: #388e3c;
    }

    .zuruecksetzen {
      background: #eeeeee;
      color: #455a64;
    }

    .zuruecksetzen:hover {
      background: #e0e0e0;
    }

    .info {
      margin-top: 20px;
      font-size: 13px;
      color: #90a4ae;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="icon">🏃‍♂️</div>

    <h1>Kinderbewegungs-Tracker</h1>

    <p class="beschreibung">
      Bewegungszeit während der Schulzeit einfach erfassen.
    </p>

    <div class="status">
      <div class="status-klein">BEWEGUNG HEUTE</div>

      <div class="minuten">
        <span id="gesamt">0</span>
      </div>

      <div>Minuten</div>
    </div>

    <input
      type="number"
      id="minuten"
      placeholder="Bewegungsminuten eingeben"
      min="1"
    >

    <button
      class="hinzufuegen"
      onclick="bewegungHinzufuegen()">
      + Bewegung hinzufügen
    </button>

    <button
      class="zuruecksetzen"
      onclick="tagZuruecksetzen()">
      Tag zurücksetzen
    </button>

    <div class="info">
      Schulzeit · Tagesübersicht
    </div>

  </div>

  <script>

    let gesamtMinuten = 0;

    function bewegungHinzufuegen() {

      const eingabe = document.getElementById("minuten");
      const minuten = Number(eingabe.value);

      if (minuten > 0) {

        gesamtMinuten = gesamtMinuten + minuten;

        document.getElementById("gesamt").textContent =
          gesamtMinuten;

        eingabe.value = "";
      }
    }

    function tagZuruecksetzen() {

      gesamtMinuten = 0;

      document.getElementById("gesamt").textContent = 0;
    }

  </script>

</body>
</html>
